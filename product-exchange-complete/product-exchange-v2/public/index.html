<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Exchange</title>
        <style>
            * { box-sizing: border-box; font-family: system-ui, sans-serif; }
            body { margin: 0; background: #f4f6f8; color: #1f2937; }
            .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
            .auth-card { width: 100%; max-width: 400px; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
            .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
            .brand-mark { background: #2563eb; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
            .muted { color: #6b7280; font-size: 14px; margin-top: -8px; margin-bottom: 20px; }
            .field { margin-bottom: 14px; }
            .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
            .field input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
            .btn { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
            .btn.secondary { background: #e5e7eb; color: #1f2937; }
            .btn.full { width: 100%; margin-top: 6px; }
            .auth-foot { text-align: center; margin-top: 16px; font-size: 14px; color: #4b5563; }
            .link { color: #2563eb; cursor: pointer; font-weight: 600; }
            .notice { background: #f3f4f6; padding: 10px; border-radius: 8px; font-size: 12px; color: #4b5563; margin-top: 16px; }
            .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
            .toast.error { background: #dc2626; }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script src="/js/app.js"></script>
    </body>
</html>
